name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (needed for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Point the build at the Android SDK already on the runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Run the game tests
        run: npm test

      - name: Fetch the Unsplash place photos
        run: sh scripts/fetch-unsplash.sh

      - name: Build the web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://dxexrgptaiozliaisiku.supabase.co' }}
          VITE_PAYPAL_URL: ${{ vars.VITE_PAYPAL_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Jn54RyU5sHS2y6TbAmJAqw_6sikm0Tt' }}

      - name: Add the Android platform
        run: npx cap add android

      - name: Use the Omertà launcher icon
        run: |
          cp -r assets/android/res/. android/app/src/main/res/
          sed -i 's/#FFFFFF/#000000/' android/app/src/main/res/values/ic_launcher_background.xml

      - name: Let the keyboard push the screen up instead of covering the message box
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if grep -q windowSoftInputMode "$M"; then sed -i 's/android:windowSoftInputMode="[^"]*"/android:windowSoftInputMode="adjustResize"/' "$M"; else sed -i 's/android:name="\.MainActivity"/android:name=".MainActivity" android:windowSoftInputMode="adjustResize"/' "$M"; fi
          grep -c adjustResize "$M"

      - name: Lock the app down (no backups, no cleartext traffic)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          if ! grep -q usesCleartextTraffic "$M"; then sed -i 's/<application/<application android:usesCleartextTraffic="false"/' "$M"; fi
          grep -c 'allowBackup="false"' "$M"

      - name: Sign every build with the same key (so a new build installs over the old one)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$GITHUB_WORKSPACE/assets/signing/omerta-sideload.keystore"; PW=omerta-sideload; AL=omerta
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/own.keystore"; KS="$RUNNER_TEMP/own.keystore"; PW="$KS_PASS"; AL="$KS_ALIAS"; fi
          G=android/app/build.gradle
          python3 - "$G" "$KS" "$PW" "$AL" "${{ github.run_number }}" <<'PY'
          import sys,re
          g,ks,pw,al,n=sys.argv[1:]
          s=open(g).read()
          sign='signingConfigs { omerta { storeFile file("%s"); storePassword "%s"; keyAlias "%s"; keyPassword "%s" } }\n    ' % (ks,pw,al,pw)
          s=s.replace("buildTypes {", sign+"buildTypes {",1)
          s=re.sub(r"versionCode \d+","versionCode "+n,s)
          s=re.sub(r'versionName "[^"]*"','versionName "1.0.'+n+'"',s)
          s=s.replace("debug {","debug {\n            signingConfig signingConfigs.omerta",1) if "debug {" in s else s.replace("release {","debug {\n            signingConfig signingConfigs.omerta\n        }\n        release {",1)
          open(g,"w").write(s)
          PY
          grep -n "signingConfig\|versionCode" "$G"

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Build a debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename the APK so every build is uniquely identifiable
        run: |
          mkdir -p renamed
          cp android/app/build/outputs/apk/debug/app-debug.apk "renamed/omerta-${{ github.run_number }}-$(date +%Y%m%d-%H%M).apk"

      - name: Check the APK is signed and installable
        run: |
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs renamed/*.apk | head -3
          "$BT/aapt" dump badging renamed/*.apk | grep -E "package:|sdkVersion|targetSdk" 

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: omerta-build-${{ github.run_number }}
          path: renamed/*.apk
