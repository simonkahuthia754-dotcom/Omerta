name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (needed for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Point the build at the Android SDK already on the runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Build the web app
        run: npm run build

      - name: Add the Android platform
        run: npx cap add android

      - name: Use the Omertà launcher icon
        run: |
          cp -r assets/android/res/. android/app/src/main/res/
          sed -i 's/#FFFFFF/#000000/' android/app/src/main/res/values/ic_launcher_background.xml

      - name: Let the keyboard push the screen up instead of covering the message box
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if grep -q windowSoftInputMode "$M"; then sed -i 's/android:windowSoftInputMode="[^"]*"/android:windowSoftInputMode="adjustResize"/' "$M"; else sed -i 's/<activity /<activity android:windowSoftInputMode="adjustResize" /' "$M"; fi
          grep -c adjustResize "$M"

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Build a debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename the APK so every build is uniquely identifiable
        run: |
          mkdir -p renamed
          cp android/app/build/outputs/apk/debug/app-debug.apk "renamed/omerta-${{ github.run_number }}-$(date +%Y%m%d-%H%M).apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: omerta-build-${{ github.run_number }}
          path: renamed/*.apk
